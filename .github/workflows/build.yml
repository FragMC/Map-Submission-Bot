name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: |
          node --check src/index.js
          node --check src/deploy-commands.js
          node --check src/config.js
          node --check src/utils/github.js
          node --check src/utils/tickets.js

      - name: Build Docker image
        run: docker build -t fragmc-mapbot:${{ github.sha }} .

      - name: Upload artifact (optional - for debugging)
        uses: actions/upload-artifact@v5
        with:
          name: mapbot-src
          path: |
            src/
            package.json
            Dockerfile
          if-no-files-found: error
